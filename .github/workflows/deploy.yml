name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          pip install fastapi scikit-learn numpy pydantic pytest -q
          pytest tests/ -v

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:            ${{ secrets.EC2_HOST }}
          username:        ${{ secrets.EC2_USER }}
          key:             ${{ secrets.EC2_KEY }}
          port:            22
          timeout:         60s
          command_timeout: 10m
          script: |
            cd qb-churn-mlops
            git pull origin main
            docker build -t qb-churn-api .
            docker stop qb-churn-api || true
            docker rm qb-churn-api   || true
            docker run -d --name qb-churn-api -p 8000:8000 qb-churn-api
            echo "✓ Deployment complete"