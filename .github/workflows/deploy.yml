name: Deploy to EC2

# Trigger: runs automatically on every push to main
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # Step 1 — Check out the latest code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2 — Run tests before deploying
      # If tests fail, deployment stops here
      - name: Run tests
        run: |
          pip install fastapi scikit-learn numpy pydantic pytest -q
          pytest tests/ -v

      # Step 3 — SSH into EC2 and redeploy
      # Pulls latest code, rebuilds Docker image, restarts container
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_KEY }}
          script: |
            cd qb-churn-mlops
            git pull origin main
            docker build -t qb-churn-api .
            docker stop qb-churn-api || true
            docker rm qb-churn-api   || true
            docker run -d --name qb-churn-api -p 8000:8000 qb-churn-api
            echo "✓ Deployment complete"